name: Build the apps (Android, Windows, Mac DMGs)

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'Sulekhak-Mac.zip'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        run: tar xzf apps/src.tar.gz -C apps
      - name: Get the language data from the live site
        run: |
          mkdir -p data
          for f in cfg lex rom big clus syl_uni syl_bi syl_chan; do
            curl -fsSL "https://sai-sudeep.github.io/assets/tools/sulekhak/$f.gz" -o "data/$f.gz"
          done
          ls -la data
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Stage the engine and data as app assets
        run: |
          A=apps/android/app/src/main/assets
          mkdir -p "$A/sulekhak"
          cp apps/shared/ime.html apps/shared/ime.js apps/shared/engine.js apps/shared/sulekhak.js "$A/"
          gunzip -c apps/shared/skel.dat.gz > "$A/skel.dat"
          gunzip -c data/cfg.gz > "$A/sulekhak/cfg.json"
          for f in lex rom big clus syl_uni syl_bi syl_chan; do gunzip -c "data/$f.gz" > "$A/sulekhak/$f.txt"; done
          du -sh "$A"
      - name: Build the APKs (all-in-one, Odia, Devanagari, Assamese, Bangla)
        run: gradle -p apps/android assembleDebug --no-daemon --stacktrace
      - name: Collect the APKs
        run: |
          mkdir -p apk
          cd apps/android/app/build/outputs/apk
          cp allinone/debug/*.apk "$GITHUB_WORKSPACE/apk/Sulekhak-Android.apk"
          for e in odia devanagari assamese bangla; do
            E="$(echo ${e:0:1} | tr a-z A-Z)${e:1}"
            cp "$e/debug/"*.apk "$GITHUB_WORKSPACE/apk/Sulekhak-Android-$E.apk"
          done
          ls -la "$GITHUB_WORKSPACE/apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Sulekhak-Android-apks
          path: apk/*.apk

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "",            num: "",  file: "Sulekhak" }
          - { name: "Odia",        num: "0", file: "Sulekhak-Odia" }
          - { name: "Devanagari",  num: "1", file: "Sulekhak-Devanagari" }
          - { name: "Bangla",      num: "2", file: "Sulekhak-Bangla" }
          - { name: "Assamese",    num: "5", file: "Sulekhak-Assamese" }
          - { name: "Phonetic",    num: "4", file: "Sulekhak-Phonetic" }
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        shell: bash
        run: tar xzf apps/src.tar.gz -C apps
      - name: Get the language data from the live site
        shell: bash
        run: |
          mkdir -p apps/windows/res
          for f in cfg lex rom big clus syl_uni syl_bi syl_chan; do
            curl -fsSL "https://sai-sudeep.github.io/assets/tools/sulekhak/$f.gz" -o "apps/windows/res/$f.gz"
          done
          cp apps/shared/ime.html apps/shared/ime.js apps/shared/engine.js apps/shared/sulekhak.js apps/shared/skel.dat.gz apps/shared/phon-data.js apps/shared/phon-core.js apps/windows/res/
          cp apps/shared/osk.html apps/shared/kb3d.js apps/windows/oskres/
          ls -la apps/windows/res
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the exe
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${{ matrix.num }}" ]; then EXTRA="-p:EditionNum=${{ matrix.num }} -p:EditionName=${{ matrix.name }}"; fi
          dotnet publish apps/windows/Sulekhak.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true $EXTRA -o out
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.file }}
          path: out/${{ matrix.file }}.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the Mac source
        run: unzip -q Sulekhak-Mac.zip -d macsrc
      - name: Build the six DMGs (all-in-one, Odia, Devanagari, Assamese, Bangla, Phonetic)
        run: |
          cd macsrc/OdiaPhonetic-Mac
          bash build.sh everything --dmg
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Sulekhak-Mac-dmgs
          path: macsrc/OdiaPhonetic-Mac/dist/*.dmg

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the iPad and iPhone keyboard source
        run: tar xzf apps/ios-src.tar.gz -C apps
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the app and keyboard (unsigned, for AltStore, SideStore or Sideloadly)
        run: |
          cd apps/ios
          xcodegen generate
          xcodebuild -project Sulekhak.xcodeproj -scheme Sulekhak -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
      - name: Make the IPA
        run: |
          cd apps/ios
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Sulekhak.app Payload/
          ls Payload/Sulekhak.app/PlugIns
          zip -qry Sulekhak-iPad.ipa Payload
          ls -la Sulekhak-iPad.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Sulekhak-iPad-ipa
          path: apps/ios/Sulekhak-iPad.ipa

  release:
    needs: [android, windows, mac, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.windows.result == 'success' && needs.mac.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish the downloads on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp dl/Sulekhak-Android-apks/*.apk out/
          for d in dl/win-*; do cp "$d"/*.exe out/; done
          for f in out/Sulekhak-*.exe; do :; done
          cp dl/Sulekhak-Mac-dmgs/*.dmg out/
          [ -d dl/Sulekhak-iPad-ipa ] && cp dl/Sulekhak-iPad-ipa/*.ipa out/ || true
          # the all-in-one Windows file keeps its old name
          [ -f out/Sulekhak.exe ] && mv out/Sulekhak.exe out/Sulekhak-Windows.exe
          for e in Odia Devanagari Bangla Assamese Phonetic; do [ -f "out/Sulekhak-$e.exe" ] && mv "out/Sulekhak-$e.exe" "out/Sulekhak-Windows-$e.exe"; done
          ls -la out
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Sulekhak Phonetic Keyboard: Mac, Windows and Android" \
            --notes "Each platform has the all-in-one (Odia, Devanagari, Assamese, Bangla, Phonetic IPA) and one file per language. Mac: Sulekhak-<language>-<version>.dmg (open it and double-click the Install file). Windows: Sulekhak-Windows*.exe, one file, no installer. Android: Sulekhak-Android*.apk (install, open the app, switch the keyboard on). iPad and iPhone: Sulekhak-iPad.ipa (install it with AltStore, SideStore or Sideloadly, see apps/ios/README.md; the web app for iPad needs no install file). Web: sai-sudeep.github.io/assets/tools/sulekhak.html and the sulekhak-<language>.html pages."
