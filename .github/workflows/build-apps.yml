name: Build the apps (Android, Windows, Mac, iPhone and iPad)

permissions:
  contents: read

concurrency:
  group: build-apps
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'Sulekhak-Mac.zip'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources and the English data
        run: |
          tar xzf apps/src.tar.gz -C apps
          mkdir -p apps/english-data && tar xzf apps/english-data.tar.gz -C apps/english-data
      - name: Get the language data from the live site
        run: |
          mkdir -p data
          for f in cfg lex rom clus syl_uni syl_bi syl_chan ng idx; do
            curl -fsSL "https://sai-sudeep.github.io/assets/tools/sulekhak/compact/$f.gz" -o "data/$f.gz"
          done
          ls -la data
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Stage the engine and data as app assets
        run: |
          A=apps/android/app/src/main/assets
          mkdir -p "$A/sulekhak"
          cp apps/shared/ime.html apps/shared/ime.js apps/shared/engine.js apps/shared/sulekhak.js apps/shared/learning.js apps/shared/drive.js apps/shared/personal.js apps/shared/english.js "$A/"
          mkdir -p "$A/sulekhak/en"
          for f in en_lex en_ng en_fix; do gunzip -c "apps/english-data/$f.txt.gz" > "$A/sulekhak/en/$f.txt"; done
          gunzip -c apps/shared/skel.dat.gz > "$A/skel.dat"
          gunzip -c data/cfg.gz > "$A/sulekhak/cfg.json"
          for f in lex rom clus syl_uni syl_bi syl_chan; do gunzip -c "data/$f.gz" > "$A/sulekhak/$f.txt"; done
          gunzip -c data/ng.gz > "$A/sulekhak/ng.bin"
          gunzip -c data/idx.gz > "$A/sulekhak/idx.bin"
          du -sh "$A"
      - name: Restore the release signing key
        id: key
        env:
          SK_B64: ${{ secrets.SK_KEYSTORE_B64 }}
        run: |
          if [ -n "$SK_B64" ] && [ -n "${{ secrets.SK_KEYSTORE_PASS }}" ]; then
            echo "$SK_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SK_KEYSTORE_PASS=${{ secrets.SK_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
            echo "SK_KEY_ALIAS=${{ secrets.SK_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SK_KEY_PASS=${{ secrets.SK_KEY_PASS }}" >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            # No private release key in the repository secrets: every build of this repository is signed with ONE fixed, deliberately published key
            # (android/ci/public-key.jks). It is not a secret and not a release identity; it only makes one public build update the previous one in place
            # (a new throw-away key on every run is what made updates "conflict with the existing package").
            P=apps/android/ci/public-key.properties
            echo "SK_KEYSTORE_FILE=$GITHUB_WORKSPACE/apps/android/ci/public-key.jks" >> "$GITHUB_ENV"
            echo "SK_KEYSTORE_PASS=$(sed -n 's/^password=//p' $P)" >> "$GITHUB_ENV"
            echo "SK_KEY_ALIAS=$(sed -n 's/^alias=//p' $P)" >> "$GITHUB_ENV"
            echo "SK_KEY_PASS=$(sed -n 's/^password=//p' $P)" >> "$GITHUB_ENV"
            echo "signed=public" >> "$GITHUB_OUTPUT"
          fi
        # the passwords are read by gradle from the environment, never written to a file
      - name: Build the APKs (all-in-one, Odia, Devanagari, Assamese, Bangla), release signed
        run: |
          # the version code only ever grows: minutes since 1970 (Android refuses an update whose number is not higher)
          VC=$(( $(date +%s) / 60 ))
          echo "VC=$VC" >> "$GITHUB_ENV"
          gradle -p apps/android assembleRelease -PskVersionCode=$VC -PskEnglish=true --no-daemon --stacktrace
      - name: Collect the APKs
        run: |
          mkdir -p apk
          cd apps/android/app/build/outputs/apk
          cp allinone/release/*.apk "$GITHUB_WORKSPACE/apk/Sulekhak-Android.apk"
          for e in odia devanagari assamese bangla; do
            E="$(echo ${e:0:1} | tr a-z A-Z)${e:1}"
            cp "$e/release/"*.apk "$GITHUB_WORKSPACE/apk/Sulekhak-Android-$E.apk"
          done
          ls -la "$GITHUB_WORKSPACE/apk"
      - name: Check the signature of every APK
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          WANT=$(tr -d ':\n ' < apps/android/release-cert.sha256 | tr A-F a-f)
          for f in apk/*.apk; do
            "$AS" verify --verbose "$f" | head -3
            GOT=$("$AS" verify --print-certs "$f" | grep 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
            echo "$f  cert SHA-256 $GOT"
            if [ "${{ steps.key.outputs.signed }}" = release ] && [ "$GOT" != "$WANT" ]; then echo "::error::$f is not signed with the release key"; exit 1; fi
          done
          echo "signed=${{ steps.key.outputs.signed }}" > apk/SIGNING.txt
      - name: The public app asks for no network permission and carries no sign-in code
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          for f in apk/*.apk; do
            "$AAPT" dump permissions "$f" > /tmp/perm.txt
            if grep -qi "INTERNET" /tmp/perm.txt; then echo "::error::$f asks for the INTERNET permission"; cat /tmp/perm.txt; exit 1; fi
          done
          echo "no INTERNET permission in any APK"
      - name: Build the test pair for the emulator (previous release, and a forged update)
        run: |
          mkdir -p apktest
          # "previous release": same key, lower version code
          gradle -p apps/android assembleAllinoneRelease -PskVersionCode=$((VC-1)) -PskEnglish=true --no-daemon -q
          cp apps/android/app/build/outputs/apk/allinone/release/*.apk apktest/old.apk
          # "forged update": same package, HIGHER version code, a different key
          keytool -genkeypair -keystore "$RUNNER_TEMP/other.jks" -storepass otherpass -keypass otherpass -alias other -keyalg RSA -keysize 2048 -validity 10 -dname "CN=forger" -storetype PKCS12
          SK_KEYSTORE_FILE="$RUNNER_TEMP/other.jks" SK_KEYSTORE_PASS=otherpass SK_KEY_ALIAS=other SK_KEY_PASS=otherpass \
            gradle -p apps/android assembleAllinoneRelease -PskVersionCode=$((VC+1)) -PskEnglish=true --no-daemon -q
          cp apps/android/app/build/outputs/apk/allinone/release/*.apk apktest/other.apk
          ls -la apktest
      - uses: actions/upload-artifact@v4
        with:
          name: Sulekhak-Android-test-apks
          path: apktest/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sulekhak-Android-apks
          path: |
            apk/*.apk
            apk/SIGNING.txt

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "",            num: "",  file: "Sulekhak" }
          - { name: "Odia",        num: "0", file: "Sulekhak-Odia" }
          - { name: "Devanagari",  num: "1", file: "Sulekhak-Devanagari" }
          - { name: "Bangla",      num: "2", file: "Sulekhak-Bangla" }
          - { name: "Assamese",    num: "5", file: "Sulekhak-Assamese" }
          - { name: "Phonetic",    num: "4", file: "Sulekhak-Phonetic" }
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        shell: bash
        run: tar xzf apps/src.tar.gz -C apps
      - name: Get the language data from the live site
        shell: bash
        run: |
          mkdir -p apps/windows/res
          for f in cfg lex rom clus syl_uni syl_bi syl_chan ng idx; do
            curl -fsSL "https://sai-sudeep.github.io/assets/tools/sulekhak/compact/$f.gz" -o "apps/windows/res/$f.gz"
          done
          cp apps/shared/ime.html apps/shared/ime.js apps/shared/engine.js apps/shared/sulekhak.js apps/shared/learning.js apps/shared/drive.js apps/shared/personal.js apps/shared/skel.dat.gz apps/shared/phon-data.js apps/shared/phon-core.js apps/windows/res/
          cp apps/shared/osk.html apps/shared/kb3d.js apps/windows/oskres/
          cp apps/shared/english.js apps/windows/res/
          mkdir -p apps/english-data && tar xzf apps/english-data.tar.gz -C apps/english-data
          for f in en_lex en_ng en_fix; do cp "apps/english-data/$f.txt.gz" "apps/windows/res/$f.gz"; done
          ls -la apps/windows/res
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the exe
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${{ matrix.num }}" ]; then EXTRA="-p:EditionNum=${{ matrix.num }} -p:EditionName=${{ matrix.name }}"; fi
          dotnet publish apps/windows/Sulekhak.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true $EXTRA -o out
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.file }}
          path: out/${{ matrix.file }}.exe

  android-upgrade-test:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        run: tar xzf apps/src.tar.gz -C apps
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, upgrade, refuse a forged update, uninstall (Android 11 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: bash apps/android/ci/upgrade_test.sh dl/Sulekhak-Android-test-apks/old.apk dl/Sulekhak-Android-apks/Sulekhak-Android.apk dl/Sulekhak-Android-test-apks/other.apk

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        run: tar xzf apps/src.tar.gz -C apps
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-mcs mono-runtime g++ g++-mingw-w64-x86-64 g++-mingw-w64-i686
      - name: English suggestions - held-out accuracy gates (completion, spelling, false corrections, speed) and swipe on simulated paths
        run: |
          mkdir -p apps/english-data && tar xzf apps/english-data.tar.gz -C apps/english-data && gunzip apps/english-data/*.gz
          node apps/core/english/tests/eval.js apps/english-data
          node apps/core/english/tests/eval_swipe.js apps/english-data
      - name: The learning store (words you choose are kept on your own device) and the scripts the apps load
        run: |
          node apps/core/sync/tests/run.js
          node apps/core/sync/tests/personal_test.js
          for f in learning drive personal; do cmp apps/core/sync/$f.js apps/shared/$f.js; done
      - name: The English test answers of the text service are what the real engine says today
        run: |
          cp apps/windows/tip/tests/en_fixture.txt /tmp/en_fixture.before
          node apps/windows/tip/tests/gen_en_fixture.js apps/english-data
          cmp /tmp/en_fixture.before apps/windows/tip/tests/en_fixture.txt
      - name: Keyboard mapping, JavaScript reference implementation (the specification itself)
        run: |
          node apps/core/keymap/run_vectors.js
          node apps/core/keymap/run_nukta.js
          node apps/core/odia/apos_test.js
      - name: The generated tables are in step with the specification
        run: |
          mkdir -p /tmp/gen && node apps/core/keymap/gen_cs.js /tmp/gen /tmp/gen /tmp/gen
          diff /tmp/gen/KeyTable.g.cs apps/windows/KeyTable.g.cs
          diff /tmp/gen/KeyVectors.g.cs apps/windows/tests/KeyVectors.g.cs
          diff /tmp/gen/keytable.inc apps/windows/tip/keytable.inc
          node apps/core/keymap/dump_decisions.js > /tmp/gen/decisions.txt
          diff /tmp/gen/decisions.txt apps/windows/tip/tests/decisions.txt
      - name: Keyboard mapping, C# implementation (Windows hook mode)
        run: sh apps/windows/tests/run.sh
      - name: Keyboard mapping, C++ implementation (Windows text service), decision-for-decision against the specification
        run: sh apps/windows/tip/tests/run.sh
      - name: Build the text service DLLs (64-bit and 32-bit) and the TSF test driver
        run: |
          cd apps/windows/tip
          sh build.sh build
          x86_64-w64-mingw32-g++ -std=c++17 -O1 -w -static -static-libgcc -static-libstdc++ -o build/tip_driver.exe tests/tip_driver.cpp -lole32 -loleaut32 -luuid -ladvapi32 -luser32 -lgdi32
      - name: Get the language data from the live site (for the swipe evaluation)
        run: |
          mkdir -p /tmp/pack/compact
          for f in cfg lex rom clus syl_uni syl_bi syl_chan ng idx; do
            curl -fsSL "https://sai-sudeep.github.io/assets/tools/sulekhak/compact/$f.gz" -o "/tmp/pack/compact/$f.gz"
          done
      - name: Swipe evaluation (synthetic gestures, fixed seed) with regression bounds
        run: |
          cd apps/core/swipe
          node gen_dataset.js --pack /tmp/pack/compact --prompts prompts.json --out /tmp/dataset.json
          node run_eval.js --engine ../../shared/sulekhak.js --pack /tmp/pack/compact --data /tmp/dataset.json --split test \
               --out /tmp/swipe_result.json --assert "top1>=72,top3>=85,top8>=90,p95<=400" | tee /tmp/swipe_summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tip-dlls
          path: |
            apps/windows/tip/build/*.dll
            apps/windows/tip/build/tip_driver.exe
      - uses: actions/upload-artifact@v4
        with:
          name: swipe-eval-result
          path: |
            /tmp/swipe_result.json
            /tmp/swipe_summary.txt

  windows-installer:
    needs: [windows, core-tests]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        shell: bash
        run: tar xzf apps/src.tar.gz -C apps
      - uses: actions/download-artifact@v4
        with:
          name: win-Sulekhak
          path: apps/out
      - uses: actions/download-artifact@v4
        with:
          name: tip-dlls
          path: apps/windows/tip/build
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          "ISCC=${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build the installer of this release and a simulated earlier release
        shell: pwsh
        working-directory: apps/windows/installer
        run: |
          $new = "1.5.${{ github.run_number }}.0"; $old = "1.4.${{ github.run_number }}.0"
          "NEWVER=$new" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OLDVER=$old" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-Item -ItemType Directory -Force ..\out | Out-Null
          & $env:ISCC /Q "/DAppVersion=$new" "/DSrcExe=..\..\out\Sulekhak.exe" "/DTipDir=..\tip\build" Sulekhak.iss
          if ($LASTEXITCODE) { throw "iscc failed" }
          Move-Item ..\out\Sulekhak-Windows-Setup.exe ..\out\Sulekhak-Windows-Setup-new.exe
          & $env:ISCC /Q "/DAppVersion=$old" "/DSrcExe=..\..\out\Sulekhak.exe" "/DTipDir=..\tip\build" Sulekhak.iss
          if ($LASTEXITCODE) { throw "iscc failed" }
          Move-Item ..\out\Sulekhak-Windows-Setup.exe ..\out\Sulekhak-Windows-Setup-old.exe
          Get-ChildItem ..\out
      - name: Install, upgrade while in use, repair, TSF driver, keyboard list, rollback, uninstall
        shell: pwsh
        env:
          SK_E2E_STRICT: '1'     # the installed program's pipe answers on a real runner (seen passing), so a regression now fails the build
        run: |
          $o = "apps\windows\out"
          & apps\windows\installer\test_install.ps1 -OldSetup "$o\Sulekhak-Windows-Setup-old.exe" -NewSetup "$o\Sulekhak-Windows-Setup-new.exe" `
              -OldVer $env:OLDVER -NewVer $env:NEWVER -Driver "apps\windows\tip\build\tip_driver.exe" -AddKeyboardsScript "apps\windows\res\AddKeyboards.ps1" -LaunchDll (Resolve-Path "apps\windows\tip\build\sulekhak_tip_x64.dll").Path
          if ($LASTEXITCODE) { exit 1 }
      - name: A real window, real key presses and screenshots (installed program and keyboard; Backspace, word list)
        if: always()
        shell: pwsh
        continue-on-error: true       # reported loudly and kept as screenshots; made blocking once it has been seen to pass on a runner
        timeout-minutes: 8
        run: |
          & apps\windows\installer\test_gui.ps1 -Setup "apps\windows\out\Sulekhak-Windows-Setup-new.exe" -Driver "apps\windows\tip\build\tip_driver.exe" -OutDir gui -AddKeyboardsScript "apps\windows\res\AddKeyboards.ps1"
          if ($LASTEXITCODE) { Write-Host "::warning::the real-window test reported failures, see the screenshots and result.txt in the windows-gui artifact"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gui-screenshots
          path: gui/*
          if-no-files-found: ignore
      - name: Logs of the installer runs
        if: always()
        shell: pwsh
        run: Get-ChildItem $env:TEMP\sk_setup_*.log | ForEach-Object { "=== $_"; Get-Content $_ -Tail 40 }
      - run: Move-Item apps\windows\out\Sulekhak-Windows-Setup-new.exe apps\windows\out\Sulekhak-Windows-Setup.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: apps/windows/out/Sulekhak-Windows-Setup.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the Mac source
        run: unzip -q Sulekhak-Mac.zip -d macsrc
      - name: English typing, run for real (the C++ rules, the JavaScript engine in JavaScriptCore, the learning file)
        run: |
          cd macsrc/OdiaPhonetic-Mac
          test ! -e google-client.json
          bash build.sh all
          build/OdiaPhonetic.app/Contents/MacOS/LekhaniOdia --selftest
      - name: Build the six DMGs (all-in-one, Odia, Devanagari, Assamese, Bangla, Phonetic)
        run: |
          cd macsrc/OdiaPhonetic-Mac
          bash build.sh everything --dmg
          ls -la dist
      - name: Update check - installing over an older install keeps the identity and the user's data
        run: |
          cd macsrc/OdiaPhonetic-Mac
          UIM="$HOME/Library/Input Methods"; SUP="$HOME/Library/Application Support/LekhaniOdia"
          mkdir -p "$UIM" "$SUP"; echo keep > "$SUP/upgrade_marker"
          NEWV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" build/dmg-all/OdiaPhonetic.app/Contents/Info.plist)
          # an "older release" already installed
          rm -rf "$UIM/OdiaPhonetic.app"; cp -R build/dmg-all/OdiaPhonetic.app "$UIM/OdiaPhonetic.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" -c "Set :CFBundleShortVersionString 0.1" "$UIM/OdiaPhonetic.app/Contents/Info.plist"
          bash "build/dmg-all/Install Sulekhak All-in-one.command" </dev/null || true
          GOTV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$UIM/OdiaPhonetic.app/Contents/Info.plist")
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$UIM/OdiaPhonetic.app/Contents/Info.plist")
          [ "$ID" = com.saisudeep.inputmethod.OdiaPhonetic ] || { echo "::error::bundle id changed: $ID"; exit 1; }
          [ "$GOTV" = "$NEWV" ] || { echo "::error::the installed copy was not replaced ($GOTV, expected $NEWV)"; exit 1; }
          [ -f "$SUP/upgrade_marker" ] || { echo "::error::user data was lost"; exit 1; }
          [ "$(ls -d "$UIM"/*.app | wc -l)" -eq 1 ] || { echo "::error::more than one input method app is installed"; ls "$UIM"; exit 1; }
          codesign --verify --deep "$UIM/OdiaPhonetic.app" && echo "code signature valid"
          # uninstall leaves the user's data
          bash "build/dmg-all/Uninstall.command" </dev/null || true
          [ ! -d "$UIM/OdiaPhonetic.app" ] && [ -f "$SUP/upgrade_marker" ] && echo "uninstall ok, data kept"
      - uses: actions/upload-artifact@v4
        with:
          name: Sulekhak-Mac-dmgs
          path: macsrc/OdiaPhonetic-Mac/dist/*.dmg

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the iPad and iPhone keyboard source and the English data
        run: |
          tar xzf apps/ios-src.tar.gz -C apps
          tar xzf apps/src.tar.gz -C apps
          mkdir -p apps/english-data && tar xzf apps/english-data.tar.gz -C apps/english-data && gunzip apps/english-data/*.gz
      - name: The calls the app makes into the scripts (node, with the same shims as the app)
        run: node apps/core/sync/host_test.js apps/ios/Shared/js
      - name: Make the small English word lists for the keyboard (its memory limit is low)
        run: python3 apps/core/english/build/make_lite.py apps/english-data apps/ios/SulekhakKeyboard/en && ls -la apps/ios/SulekhakKeyboard/en
      - name: English typing and the engine host, run for real in JavaScriptCore (the Swift code of the keyboard against a text in a string)
        run: |
          cd apps/ios
          swiftc -O -o /tmp/skselftest Shared/SKHost.swift SulekhakKeyboard/EnglishTyper.swift tests/main.swift
          mkdir -p /tmp/skstore
          SK_JS_DIR="$PWD/Shared/js" SK_EN_DIR="$PWD/SulekhakKeyboard/en" SK_STORAGE_DIR=/tmp/skstore /tmp/skselftest
      - name: Get the language model files from the live site
        run: |
          D=apps/ios/SulekhakKeyboard
          for f in cfg lex rom clus syl_uni syl_bi syl_chan ng idx; do
            curl -fsSL "https://sai-sudeep.github.io/assets/tools/sulekhak/compact/$f.gz" -o "/tmp/$f.gz"
          done
          gunzip -c /tmp/cfg.gz > $D/sk_cfg.json
          for f in lex rom clus syl_uni syl_bi syl_chan; do gunzip -c /tmp/$f.gz > $D/sk_$f.txt; done
          gunzip -c /tmp/ng.gz > $D/sk_ng.bin
          gunzip -c /tmp/idx.gz > $D/sk_idx.bin
          ls -la $D | head -40
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the app and keyboard (unsigned, for AltStore, SideStore or Sideloadly)
        run: |
          cd apps/ios
          xcodegen generate
          xcodebuild -project Sulekhak.xcodeproj -scheme Sulekhak -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=$(( $(date +%s) / 60 )) MARKETING_VERSION=1.2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
      - name: Make the IPA
        run: |
          cd apps/ios
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Sulekhak.app Payload/
          ls Payload/Sulekhak.app/PlugIns
          KBX=$(echo Payload/Sulekhak.app/PlugIns/*.appex)
          for f in en/en_lex.txt en/en_ng.txt js/host.js; do test -s $KBX/$f || { echo "missing $f in the keyboard"; exit 1; }; done
          test ! -e Payload/Sulekhak.app/personal-config.json
          # identity must be exactly these two ids on every release, and the version number must grow (iOS refuses an update with a lower one)
          A=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/Sulekhak.app/Info.plist)
          K=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/Sulekhak.app/PlugIns/*.appex/Info.plist)
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/Sulekhak.app/Info.plist)
          echo "app=$A keyboard=$K build=$V"
          [ "$A" = com.saisudeep.sulekhak ] && [ "$K" = com.saisudeep.sulekhak.keyboard ] || { echo "::error::bundle identifiers changed"; exit 1; }
          zip -qry Sulekhak-iPad.ipa Payload
          ls -la Sulekhak-iPad.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Sulekhak-iPad-ipa
          path: apps/ios/Sulekhak-iPad.ipa

  release:
    needs: [android, android-upgrade-test, core-tests, windows, windows-installer, mac, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.android-upgrade-test.result == 'success' && needs.core-tests.result == 'success' && needs.windows.result == 'success' && needs.windows-installer.result == 'success' && needs.mac.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish the downloads on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp dl/Sulekhak-Android-apks/*.apk out/
          for d in dl/win-*; do cp "$d"/*.exe out/; done
          cp dl/swipe-eval-result/swipe_summary.txt out/Swipe-evaluation-summary.txt || true
          for f in out/Sulekhak-*.exe; do :; done
          cp dl/Sulekhak-Mac-dmgs/*.dmg out/
          # DMGs get version-free names so the links in the README never change
          for f in out/Sulekhak-*.dmg; do
            b=$(basename "$f" .dmg); b=${b%-[0-9]*}; L=${b#Sulekhak-}
            case "$L" in All-in-one) N=Sulekhak-Mac ;; Phonetic-IPA) N=Sulekhak-Mac-Phonetic ;; *) N=Sulekhak-Mac-$L ;; esac
            mv "$f" "out/$N.dmg"
          done
          [ -d dl/Sulekhak-iPad-ipa ] && cp dl/Sulekhak-iPad-ipa/*.ipa out/ || true
          # the all-in-one Windows file keeps its old name
          [ -f out/Sulekhak.exe ] && mv out/Sulekhak.exe out/Sulekhak-Windows.exe
          for e in Odia Devanagari Bangla Assamese Phonetic; do [ -f "out/Sulekhak-$e.exe" ] && mv "out/Sulekhak-$e.exe" "out/Sulekhak-Windows-$e.exe"; done
          ls -la out
          NOTE=""
          if grep -q 'signed=public' dl/Sulekhak-Android-apks/SIGNING.txt 2>/dev/null; then NOTE="Android: every build of this repository is signed with the same fixed public key, so a new build installs over the previous one (builds made before 25 October 2026 used a different key: uninstall that one once). "; fi
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Sulekhak Phonetic Keyboard: Mac, Windows and Android" \
            --notes "${NOTE}Each platform has the all-in-one (Odia, Devanagari, Assamese, Bangla, Phonetic IPA) and one file per language. Mac: Sulekhak-Mac.dmg and Sulekhak-Mac-<language>.dmg (open it and double-click the Install file). Windows: Sulekhak-Windows-Setup.exe (installer: adds Sulekhak to Win+Space, updates in place) or the portable Sulekhak-Windows*.exe (no installer, older keyboard-hook mode). Android: Sulekhak-Android*.apk (install, open the app, switch the keyboard on). iPad and iPhone: Sulekhak-iPad.ipa (install it with AltStore, SideStore or Sideloadly, see docs/ios.md; the web app for iPad needs no install file). Web: sai-sudeep.github.io/assets/tools/sulekhak.html and the sulekhak-<language>.html pages."
